<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card - Nirwan Trenggana</title>
    <link rel="stylesheet" href="styling.css">
</head>
<body>

    <div class="background">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>

        <div class="card">
            <div class="profile">
                <img src="image.jpg" alt="Foto Profil Nirwan">
            </div>

            <div class="content">
                <h2>Nirwan Trenggana</h2>
                <p class="description">
                    Saya pribadi yang memiliki keterampilan sebagai pemimpin dan
                    skill komunikasi yang baik serta memiliki tanggung jawab
                    terhadap tim.
                </p>

                <div class="divider"></div>

                <p class="job">
                    Hobi: <span>Futsal</span><br>
                    Fakultas: <span>Rekayasa Industri</span><br>
                    Program Studi: <span>S1 Sistem Informasi</span>
                </p>
                <div class="social">
                    <a href="https://www.instagram.com/nrwant_" target="_blank" aria-label="Instagram">
                    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram">
                    </a>

                    <a href="https://www.linkedin.com/in/nirwan trenggana" target="_blank" aria-label="LinkedIn">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn">
                    </a>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
